<!-- نسخة مجمَّدة من نوافذ المعاينة العشر في body.html قبل المرحلة 27 — مرجع اختبار فقط -->
<div id="pdPrintModal" class="print-modal">
    <div class="modal-box">
      <div class="modal-header"><h3 id="pdModalTitle">📄 معاينة الوثيقة</h3><button class="modal-close" onclick="document.getElementById('pdPrintModal').classList.remove('open')">✕</button></div>
      <div class="modal-body" id="pdReportContent"></div>
      <div class="modal-footer" style="padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="document.getElementById('pdPrintModal').classList.remove('open')">إغلاق</button>
        <button class="btn btn-primary" onclick="if(typeof _waitLogoThenPrint==='function')_waitLogoThenPrint();else window.print()">🖨️ طباعة</button>
        <button class="btn btn-success" onclick="exportToWord('pdReportContent', document.getElementById('pdModalTitle').dataset.f || 'وثيقة')" style="background:#1d6f42;color:white;border:none;border-radius:8px;padding:9px 18px;font-family:'Cairo',sans-serif;font-size:0.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;">📝 تحميل Word</button>
      </div>
    </div>
  </div>
